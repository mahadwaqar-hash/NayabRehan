<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1A18"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Rounded Clay Square -->
  <rect width="64" height="64" rx="16" fill="url(#clayGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#E6D5BD" stroke-width="1.2" stroke-opacity="0.25"/>
  <!-- Elegant Monogram -->
  <text x="32" y="38" font-family="'Bodoni Moda', 'Cormorant Garamond', Georgia, serif" font-size="23" font-weight="700" fill="#E6D5BD" text-anchor="middle" letter-spacing="1.5">NR</text>
  <!-- Haute Terracotta Dot Accent -->
  <circle cx="32" cy="47" r="2.8" fill="#D5360C" filter="url(#softGlow)"/>
</svg>